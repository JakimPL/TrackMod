name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Install the locked environment
        run: uv sync --locked

      - name: Check that the tag names the project version
        if: github.event_name == 'push'
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME names a version other than the project's $version"
            exit 1
          fi

      - name: Take the release notes from the changelog
        if: github.event_name == 'push'
        run: |
          mkdir notes
          awk -v version="$GITHUB_REF_NAME" '
            $1 == "##" { if (found) exit; found = ($2 == version && $3 ~ /^\[[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]\]$/); next }
            found
          ' CHANGELOG.md > notes/notes.md
          if ! grep -q '[^[:space:]]' notes/notes.md; then
            echo "::error::CHANGELOG.md holds no dated section for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Number the rehearsal as a development release
        if: github.event_name == 'workflow_dispatch'
        run: uv version --frozen "$(uv version --short).dev$GITHUB_RUN_NUMBER"

      - name: Build the distributions
        run: uv build --no-sources

      - name: Check the distributions
        run: uv run --no-sync twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: notes
          path: notes/
          if-no-files-found: error

  verify:
    name: Test the built wheel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Install the test tools and the built wheel
        run: |
          uv sync --locked --no-install-project
          uv pip install dist/*.whl

      - name: Check that the tests import the installed wheel
        run: >-
          uv run --no-sync python -c "import pathlib, trackmod;
          assert 'site-packages' in pathlib.Path(trackmod.__file__).parts, trackmod.__file__"

      - name: Run the tests
        run: uv run --no-sync pytest

  publish:
    name: Publish the distributions
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
      url: ${{ github.event_name == 'push' && 'https://pypi.org/p/trackmod' || 'https://test.pypi.org/p/trackmod' }}
    permissions:
      id-token: write # Trusted Publishing proves the upload comes from this workflow
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    name: Create the GitHub release
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the GitHub release and attaches the distributions
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: notes

      - name: Create the release with the distributions attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "TrackMod $GITHUB_REF_NAME"
          --notes-file notes/notes.md
