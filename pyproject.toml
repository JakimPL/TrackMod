[project]
name = "trackmod"
version = "0.2.0"
description = "Read, write and convert tracker music modules: Impulse Tracker, FastTracker 2, ProTracker, Scream Tracker 3 and Soundtracker"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jakim (Stage Magician)", email = "jakimpl@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "tracker",
    "module",
    "music",
    "chiptune",
    "impulse-tracker",
    "fasttracker",
    "protracker",
    "scream-tracker",
    "soundtracker",
    "it",
    "xm",
    "mod",
    "s3m",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=2.1",
    "pydantic>=2.7.4",
]

[project.urls]
Homepage = "https://github.com/JakimPL/TrackMod"
Repository = "https://github.com/JakimPL/TrackMod"
Documentation = "https://github.com/JakimPL/TrackMod/tree/main/docs"
Changelog = "https://github.com/JakimPL/TrackMod/blob/main/CHANGELOG.md"
Issues = "https://github.com/JakimPL/TrackMod/issues"

[dependency-groups]
dev = [
    "black==26.5.1",
    "isort==9.0.1",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pylint==4.0.9",
    "pylint-pydantic==0.4.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "twine==7.0.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackmod"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "docs", "CHANGELOG.md"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["trackmod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["trackmod"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mypy]
python_version = "3.12"
files = ["src/trackmod"]
exclude = ["tests"]
disallow_subclassing_any = true
ignore_missing_imports = true
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
