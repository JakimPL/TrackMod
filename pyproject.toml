[project]
name = "trackmod"
version = "0.2.0"
description = "A Python library for tracker module specifications and interfaces (Impulse Tracker, FastTracker 2, Amiga ProTracker)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jakim" }]

dependencies = [
    "numpy>=2.1",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "isort==8.0.1",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pylint==4.0.6",
    "pylint-pydantic==0.4.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackmod"]

[tool.hatch.build.targets.wheel.force-include]
"src/trackmod/py.typed" = "trackmod/py.typed"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["trackmod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["trackmod"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mypy]
python_version = "3.12"
files = ["src/trackmod"]
exclude = ["tests"]
disallow_subclassing_any = true
ignore_missing_imports = true
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
